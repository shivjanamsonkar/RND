name: Security Scan on Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  security-scan:
    name: Code Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: pip install bandit semgrep

      - name: Run Bandit (Python files)
        id: bandit
        continue-on-error: true
        run: |
          PYTHON_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD -- '*.py' | head -50)
          if [ -z "$PYTHON_FILES" ]; then
            echo "No Python files changed."
            echo "result=skip" >> "$GITHUB_OUTPUT"
          else
            echo "$PYTHON_FILES" | xargs bandit -f json -o /tmp/bandit-report.json || true
            echo "result=done" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Semgrep (all supported files)
        id: semgrep
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }} HEAD | head -50)
          if [ -z "$CHANGED" ]; then
            echo "No files changed."
            echo "result=skip" >> "$GITHUB_OUTPUT"
          else
            echo "$CHANGED" | xargs semgrep --config auto --json --quiet \
              -o /tmp/semgrep-report.json || true
            echo "result=done" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse and post findings as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lines = ['## 🔐 Automated Security Scan\n'];
            const sevOrder = { ERROR: 0, WARNING: 1, INFO: 2 };

            // ── Bandit ─────────────────────────────────────────────────────
            let banditFindings = 0;
            if (fs.existsSync('/tmp/bandit-report.json')) {
              const data = JSON.parse(fs.readFileSync('/tmp/bandit-report.json'));
              const issues = (data.results || []);
              banditFindings = issues.length;
              if (issues.length) {
                lines.push('### Bandit (Python)\n');
                lines.push('| Severity | Rule | File | Line | Description |\n');
                lines.push('|----------|------|------|------|-------------|\n');
                issues.slice(0, 30).forEach(i => {
                  lines.push(`| ${i.issue_severity} | \`${i.test_id}\` | \`${i.filename}\` | ${i.line_number} | ${i.issue_text} |\n`);
                });
                if (issues.length > 30) lines.push(`> … and ${issues.length - 30} more.\n`);
              }
            }

            // ── Semgrep ────────────────────────────────────────────────────
            let semgrepFindings = 0;
            if (fs.existsSync('/tmp/semgrep-report.json')) {
              const data = JSON.parse(fs.readFileSync('/tmp/semgrep-report.json'));
              const results = (data.results || []).sort((a, b) =>
                (sevOrder[a.extra?.severity] ?? 9) - (sevOrder[b.extra?.severity] ?? 9)
              );
              semgrepFindings = results.length;
              if (results.length) {
                lines.push('\n### Semgrep\n');
                lines.push('| Severity | Rule | File | Line | Description |\n');
                lines.push('|----------|------|------|------|-------------|\n');
                results.slice(0, 30).forEach(r => {
                  const sev = r.extra?.severity ?? 'INFO';
                  const line = r.start?.line ?? '—';
                  lines.push(`| ${sev} | \`${r.check_id}\` | \`${r.path}\` | ${line} | ${r.extra?.message ?? ''} |\n`);
                });
                if (results.length > 30) lines.push(`> … and ${results.length - 30} more.\n`);
              }
            }

            lines.push('\n---\n');
            const total = banditFindings + semgrepFindings;
            if (total === 0) {
              lines.push('✅ **No security issues found in changed files.**\n');
            } else {
              lines.push(`⚠️ **${total} security finding(s) detected.** Please review before merging.\n`);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('')
            });
